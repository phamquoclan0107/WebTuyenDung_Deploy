server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip ────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml font/woff2;

    # ── Static assets — cache 1 năm (Vite dùng content hash) ────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── robots.txt — không cache ─────────────────────────────────────────
    location = /robots.txt {
        add_header Cache-Control "no-cache";
        expires 0;
    }

    # ── sitemap.xml — proxy sang Spring Boot (cùng jobapp_net) ──────────
    # "app" là tên service trong docker-compose.yml
    location = /sitemap.xml {
        proxy_pass         http://app:8080/sitemap.xml;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        add_header         Cache-Control "public, max-age=3600";
    }

    # ── SPA fallback ─────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
